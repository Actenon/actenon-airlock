name: Airlock Authority Review
description: Discover Python agent authority and compare against a signed trusted Git baseline.
inputs:
  base:
    description: Trusted base Git ref containing the signed Airlock baseline
    required: true
outputs:
  diff:
    description: Path to the JSON authority diff
    value: ${{ steps.review.outputs.diff }}
runs:
  using: composite
  steps:
    - name: Install pinned Airlock components
      shell: bash
      env:
        AIRLOCK_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$AIRLOCK_ACTION_PATH"
    - name: Airlock / Authority Review
      id: review
      shell: bash
      env:
        AIRLOCK_TRUSTED_BASE: ${{ inputs.base }}
      run: |
        echo "diff=$GITHUB_WORKSPACE/authority-diff.json" >> "$GITHUB_OUTPUT"
        airlock check --path "$GITHUB_WORKSPACE" --base "$AIRLOCK_TRUSTED_BASE" --github --output "$GITHUB_WORKSPACE/authority-diff.json"
