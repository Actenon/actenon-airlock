[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actenon-airlock"
version = "0.1.0.dev0"
description = "See and control the powers of your Python AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "actenon-scan @ git+https://github.com/Actenon/actenon-scan.git@ee971b43c78ed8b58f5f7fb59382ab20ce9b8a5c",
  "actenon-protocol @ git+https://github.com/Actenon/actenon-protocol.git@4cbd8f04e0db331b2ffd490d50c0a7aede2d35ff",
  "actenon-kernel @ git+https://github.com/Actenon/actenon-kernel.git@5ca02e10bf329bfa090530d77301686e5995de3a",
  "actenon-permit @ git+https://github.com/Actenon/actenon-permit.git@2a429d5b2de2f0ba3ecc1c91996ae25c8d84ff61",
  "requests>=2.32,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8", "build>=1.2", "ruff>=0.8", "PyGithub>=2.5,<3",
  "openai>=1.50,<3", "anthropic>=0.40,<1",
]

[project.scripts]
airlock = "actenon_airlock.cli:main"

[project.urls]
Repository = "https://github.com/Actenon/actenon-airlock"
Issues = "https://github.com/Actenon/actenon-airlock/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
