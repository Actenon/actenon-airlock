[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actenon-airlock"
version = "0.1.0.dev0"
description = "See and control the powers of your Python AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "actenon-scan @ git+https://github.com/Actenon/actenon-scan.git@ef8487af836158a028f9a68eb96fd59a0be9cc0b",
  "actenon-protocol @ git+https://github.com/Actenon/actenon-protocol.git@d79af481be6badc99b13e15118026b96883fa171",
  "actenon-kernel @ git+https://github.com/Actenon/actenon-kernel.git@1491379c40e95b8d64e7332b1be9c98c4b1ee8a8",
  "actenon-permit @ git+https://github.com/Actenon/actenon-permit.git@4d9bc08ab4934cdae5133a42b1b66ae7896ba678",
  "requests>=2.32,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8", "build>=1.2", "ruff>=0.8", "PyGithub>=2.5,<3",
  "openai>=1.50,<3", "anthropic>=0.40,<1",
]

[project.scripts]
airlock = "actenon_airlock.cli:main"

[project.urls]
Repository = "https://github.com/Actenon/actenon-airlock"
Issues = "https://github.com/Actenon/actenon-airlock/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
