[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actenon-airlock"
version = "0.1.0.dev0"
description = "See and control the powers of your Python AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "actenon-scan @ git+https://github.com/Actenon/actenon-scan.git@b1b55ca307ea2b1101a1d9f07eb8f44538ce8bb0",
  "actenon-protocol @ git+https://github.com/Actenon/actenon-protocol.git@a2e0e08fcd24b71eb1668204ba6bed00e4c63551",
  "actenon-kernel @ git+https://github.com/Actenon/actenon-kernel.git@fc0f9982f970e87de4692bdedb9c20cb28cb305a",
  "actenon-permit @ git+https://github.com/Actenon/actenon-permit.git@fe953178e116bfe4fbf83e407673e48984482b78",
  "requests>=2.32,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8", "build>=1.2", "ruff>=0.8", "PyGithub>=2.5,<3",
  "openai>=1.50,<3", "anthropic>=0.40,<1",
]

[project.scripts]
airlock = "actenon_airlock.cli:main"

[project.urls]
Repository = "https://github.com/Actenon/actenon-airlock"
Issues = "https://github.com/Actenon/actenon-airlock/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv]
# Integration candidate: Kernel's and Permit's own [tool.uv.sources] name
# Protocol d79af48 and Kernel 1491379; this candidate tests the PR heads
# instead (see release/candidate-manifest.json). pip ignores uv sources and
# installs the direct references above; these keep uv.lock identical to that.
override-dependencies = [
  "actenon-protocol @ git+https://github.com/Actenon/actenon-protocol.git@a2e0e08fcd24b71eb1668204ba6bed00e4c63551",
  "actenon-kernel[asymmetric] @ git+https://github.com/Actenon/actenon-kernel.git@fc0f9982f970e87de4692bdedb9c20cb28cb305a",
]
