name: Release admission
# Reports a candidate's readiness from authenticated evidence, with a mandatory
# threshold (exit 1 below it). Dispatch it from main so the rules in
# release/gates.json come from reviewed code, not from the candidate.
# This workflow checks readiness; it does not prevent publication. Publication
# is enforced by release.yml, whose build, publish and tag jobs all need the
# same gate to pass first. There is deliberately no tag-push trigger: a check
# triggered by a tag can only run after the tag already exists.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character Airlock commit to evaluate
        required: true
        type: string
      required_status:
        description: Minimum readiness the candidate must reach
        required: true
        type: choice
        options:
          - CANDIDATE READY
          - RELEASE READY
permissions:
  contents: read
  actions: read
  checks: read
  attestations: read
defaults:
  run:
    shell: bash
jobs:
  admission:
    name: Release-admission gate (G1-G40)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Evaluate candidate against authenticated evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate_sha }}
          REQUIRED: ${{ inputs.required_status }}
        run: |
          python scripts/check_candidate_admission.py \
            --candidate-sha "$CANDIDATE" \
            --require "$REQUIRED" \
            --report admission-report.json
      - name: Preserve admission report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-admission-report
          path: admission-report.json
          if-no-files-found: error
