name: Airlock CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  integration:
    name: Integration (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Full history: the documented-install pin tests need the pinned product commit
          # and its predecessor, and the trusted contract does not allow them to skip.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install exactly what uv.lock pins, recording what pip installed
        # Registry-locked dependencies install by sha256 only; pip's report is gate evidence.
        run: |
          python -m venv /tmp/airlock-integration
          /tmp/airlock-integration/bin/python -m pip install --upgrade pip
          python scripts/install_candidate.py --python /tmp/airlock-integration/bin/python --report "$RUNNER_TEMP/install-report.json"
          echo "/tmp/airlock-integration/bin" >> "$GITHUB_PATH"
      - name: Audit the installed dependencies
        if: matrix.python == '3.12'
        # The auditor must not modify the environment under test.
        run: |
          python -m venv /tmp/dependency-auditor
          /tmp/dependency-auditor/bin/python -m pip install --upgrade pip "pip-audit>=2.10.1"
          installed_site=$(python -c "import sysconfig; print(sysconfig.get_path('purelib'))")
          /tmp/dependency-auditor/bin/python -m pip_audit --strict --vulnerability-service osv --path "$installed_site" --format json --output pip-audit.installed.json
      - name: Inspect installation
        run: |
          airlock doctor --json | tee doctor.json
          python -m pip freeze > installed.txt
      - name: Integration and boundary tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Collect the install report (kept out of the tree while tests run)
        if: always()
        run: cp "$RUNNER_TEMP/install-report.json" . || true
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-python-${{ matrix.python }}
          path: |
            test-results.xml
            doctor.json
            installed.txt
            install-report.json
            pip-audit.installed.json
  documented-install:
    name: Documented install and first run (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Full history: the pinned commit must be merged history of this branch.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pipx, as the README tells a newcomer to
        run: python -m pip install "pipx==1.8.0"
      - name: Every guide pins one commit that installs this branch's code
        run: python scripts/check_readme_install.py
      - name: The documented first-run journey in a fresh HOME, from cold images
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep actenon-airlock && exit 1 || true
          python scripts/stranger_acceptance.py --python "$(command -v python)" --output stranger-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stranger-acceptance-${{ matrix.python }}
          path: stranger-acceptance.json
  package:
    name: Package and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install build ruff
      - run: ruff check src tests scripts acceptance/codex-cli containers/codex-cli
      - run: ruff format --check src tests scripts acceptance/codex-cli containers/codex-cli
      - run: python -m build
      - name: Install built wheel with real pinned dependencies
        run: |
          python -m venv /tmp/airlock-wheel
          /tmp/airlock-wheel/bin/python -m pip install --upgrade pip
          /tmp/airlock-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/airlock-wheel/bin/airlock doctor --json
          /tmp/airlock-wheel/bin/airlock --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-build-not-a-release
          path: dist/
  protected:
    name: Protected container acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exactly what uv.lock pins, recording what pip installed
        run: python scripts/install_candidate.py --report "$RUNNER_TEMP/install-report.json"
      - name: Build credential-free compute image
        run: docker build -f containers/Dockerfile.compute -t actenon-airlock-compute:dev .
      - name: Build the pinned Claude Code image
        run: docker build -f containers/Dockerfile.claude-code -t actenon-airlock-claude-code:v1 .
      - name: Build pinned unchanged Codex image
        run: docker build -f containers/Dockerfile.codex-cli -t actenon-airlock-codex-cli:v1 .
      - name: Build the documented Go and TypeScript toolchain images
        run: |
          docker build -f examples/toolchains/Dockerfile.go -t airlock-example-go:ci examples/toolchains/sample-go
          docker build -f examples/toolchains/Dockerfile.node -t airlock-example-node:ci examples/toolchains/sample-node
      - name: Run positive workflow and bypass attempts in one contained environment
        env:
          AIRLOCK_TEST_GO_IMAGE: airlock-example-go:ci
          AIRLOCK_TEST_NODE_IMAGE: airlock-example-node:ci
          AIRLOCK_TEST_PROTECTED_IMAGE: actenon-airlock-compute:dev
          AIRLOCK_TEST_CODEX_IMAGE: actenon-airlock-codex-cli:v1
          AIRLOCK_CODEX_EVIDENCE: ${{ github.workspace }}/codex-evidence
          AIRLOCK_TEST_CLAUDE_CODE_IMAGE: actenon-airlock-claude-code:v1
          AIRLOCK_PROTECTED_EVIDENCE: ${{ github.workspace }}/protected-evidence
        run: python -m pytest -q tests/test_protected.py tests/test_github_container.py tests/test_guided_workflow.py tests/test_claude_code_container.py tests/test_anthropic_acceptance.py tests/test_gate5_matched_programme.py tests/test_github_consequence_acceptance.py tests/test_codex_container.py tests/test_protect.py tests/test_verification_profiles.py tests/test_verification_outcomes.py tests/test_first_run_failures.py tests/test_supervisor_credential_isolation.py --junitxml=protected-results.xml
      - name: Independent containment with working transport controls
        env:
          AIRLOCK_TEST_PROTECTED_IMAGE: actenon-airlock-compute:dev
          AIRLOCK_INDEPENDENT_EVIDENCE: ${{ github.workspace }}/independent-boundary-evidence
        run: python -m pytest -q tests/test_independent_container.py --junitxml=independent-boundary-results.xml
      - name: Collect the install report (kept out of the tree while tests run)
        if: always()
        run: cp "$RUNNER_TEMP/install-report.json" . || true
      - name: Preserve public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-container-acceptance
          path: |
            install-report.json
            protected-results.xml
            protected-evidence/
            codex-evidence/
            independent-boundary-results.xml
            independent-boundary-evidence/

  registry-rehearsal:
    name: Registry rehearsal (security suites on registry-installed artifacts)
    # Before publication, PyPI is stood in for by a hashed local index of wheels built from the
    # exact pinned commits. Lock, install and identity take the registry path, exactly as a
    # release candidate's CI does against PyPI; then the integration, container and independent
    # suites must pass on that install. Nothing is published and nothing leaves the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build the four dependency wheels from their pinned commits into a hashed index
        run: python scripts/rehearse_registry_release.py prepare --work /tmp/rehearsal
      - name: Verify each wheel against its commit with the admission gate's content check
        run: python scripts/rehearse_registry_release.py verify --work /tmp/rehearsal
      - name: Serve the rehearsal index on the runner only
        run: |
          nohup python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/rehearsal/index > /tmp/index.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8765/simple/ >/dev/null && break; sleep 1; done
      - name: Lock against it and commit a release-shaped tree locally (never pushed)
        run: |
          python -m venv /tmp/uv-tool
          /tmp/uv-tool/bin/python -m pip install --quiet "uv==0.11.25"
          /tmp/uv-tool/bin/uv lock --index http://127.0.0.1:8765/simple
          git -c user.name=rehearsal -c user.email=rehearsal@invalid commit -qam "rehearsal: registry pins"
          python scripts/check_readme_install.py --pin
          git -c user.name=rehearsal -c user.email=rehearsal@invalid commit -qam "rehearsal: docs pin"
          git status --porcelain --untracked-files=all
      - name: Install by locked sha256 from the rehearsal registry
        run: |
          python -m venv /tmp/rehearsal-venv
          /tmp/rehearsal-venv/bin/python -m pip install --upgrade pip
          python scripts/install_candidate.py --python /tmp/rehearsal-venv/bin/python --index http://127.0.0.1:8765/simple --report "$RUNNER_TEMP/install-report.json"
          echo "/tmp/rehearsal-venv/bin" >> "$GITHUB_PATH"
          /tmp/rehearsal-venv/bin/python -m pip freeze > "$RUNNER_TEMP/installed.txt"
          # Identity v2 takes locked wheels only from PyPI or its content-addressed store; the
          # referee scrubs the runner's environment, so seed the default store itself.
          mkdir -p "$HOME/.cache/actenon-airlock/acceptance-artifacts"
          cp /tmp/rehearsal/index/files/*.whl "$HOME/.cache/actenon-airlock/acceptance-artifacts/"
      - name: Integration suite on the registry install
        run: python -m pytest -q --junitxml=rehearsal-integration-results.xml
      - name: Build the images the container suite needs
        run: |
          docker build -f containers/Dockerfile.compute -t actenon-airlock-compute:dev .
          docker build -f containers/Dockerfile.claude-code -t actenon-airlock-claude-code:v1 .
          docker build -f containers/Dockerfile.codex-cli -t actenon-airlock-codex-cli:v1 .
          docker build -f examples/toolchains/Dockerfile.go -t airlock-example-go:ci examples/toolchains/sample-go
          docker build -f examples/toolchains/Dockerfile.node -t airlock-example-node:ci examples/toolchains/sample-node
      - name: Container security suite on the registry install
        env:
          AIRLOCK_TEST_GO_IMAGE: airlock-example-go:ci
          AIRLOCK_TEST_NODE_IMAGE: airlock-example-node:ci
          AIRLOCK_TEST_PROTECTED_IMAGE: actenon-airlock-compute:dev
          AIRLOCK_TEST_CODEX_IMAGE: actenon-airlock-codex-cli:v1
          AIRLOCK_CODEX_EVIDENCE: ${{ github.workspace }}/rehearsal-codex-evidence
          AIRLOCK_TEST_CLAUDE_CODE_IMAGE: actenon-airlock-claude-code:v1
          AIRLOCK_PROTECTED_EVIDENCE: ${{ github.workspace }}/rehearsal-protected-evidence
        run: python -m pytest -q tests/test_protected.py tests/test_github_container.py tests/test_guided_workflow.py tests/test_claude_code_container.py tests/test_anthropic_acceptance.py tests/test_gate5_matched_programme.py tests/test_github_consequence_acceptance.py tests/test_codex_container.py tests/test_protect.py tests/test_verification_profiles.py tests/test_verification_outcomes.py tests/test_first_run_failures.py tests/test_supervisor_credential_isolation.py --junitxml=rehearsal-protected-results.xml
      - name: Independent containment on the registry install
        env:
          AIRLOCK_TEST_PROTECTED_IMAGE: actenon-airlock-compute:dev
          AIRLOCK_INDEPENDENT_EVIDENCE: ${{ github.workspace }}/rehearsal-independent-evidence
        run: python -m pytest -q tests/test_independent_container.py --junitxml=rehearsal-independent-results.xml
      - name: Collect rehearsal evidence (kept out of the tree while tests run)
        if: always()
        run: cp "$RUNNER_TEMP/install-report.json" "$RUNNER_TEMP/installed.txt" /tmp/rehearsal/rehearsal.json /tmp/rehearsal/provenance.json . || true
      - name: Preserve rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registry-rehearsal
          path: |
            install-report.json
            installed.txt
            uv.lock
            pyproject.toml
            rehearsal-integration-results.xml
            rehearsal-protected-results.xml
            rehearsal-independent-results.xml
            rehearsal.json
            provenance.json
