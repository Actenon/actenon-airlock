name: Airlock CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  integration:
    name: Integration (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install the real pinned components
        run: |
          python -m venv /tmp/airlock-integration
          /tmp/airlock-integration/bin/python -m pip install --upgrade pip
          /tmp/airlock-integration/bin/python -m pip install ".[test]"
          echo "/tmp/airlock-integration/bin" >> "$GITHUB_PATH"
      - name: Audit the installed dependencies
        if: matrix.python == '3.12'
        # The auditor must not modify the environment under test.
        run: |
          python -m venv /tmp/dependency-auditor
          /tmp/dependency-auditor/bin/python -m pip install --upgrade pip "pip-audit>=2.10.1"
          installed_site=$(python -c "import sysconfig; print(sysconfig.get_path('purelib'))")
          /tmp/dependency-auditor/bin/python -m pip_audit --strict --vulnerability-service osv --path "$installed_site" --format json --output pip-audit.installed.json
      - name: Inspect installation
        run: |
          airlock doctor --json | tee doctor.json
          python -m pip freeze > installed.txt
      - name: Integration and boundary tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-python-${{ matrix.python }}
          path: |
            test-results.xml
            doctor.json
            installed.txt
            pip-audit.installed.json
  package:
    name: Package and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install build ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m build
      - name: Install built wheel with real pinned dependencies
        run: |
          python -m venv /tmp/airlock-wheel
          /tmp/airlock-wheel/bin/python -m pip install --upgrade pip
          /tmp/airlock-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/airlock-wheel/bin/airlock doctor --json
          /tmp/airlock-wheel/bin/airlock --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-build-not-a-release
          path: dist/
