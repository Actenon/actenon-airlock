name: Release
# The only supported path to a published Airlock release.
#
# Admission runs first, using the default branch's reviewed gate code, against
# the exact candidate commit. Build, publish and tag all need it, so a candidate
# that is not RELEASE READY is never built for release, published or tagged.
# The tag is created last, by this workflow, at the admitted commit: a tag can
# never exist before admission (a tag-triggered check would only run after).
#
# Owner setup before first use (see release/settings/README.md): the
# `pypi-release` environment with required reviewers, a PyPI trusted publisher
# for this workflow, a tag ruleset that lets only this workflow create v* tags,
# and branch protection on main.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character Airlock commit to release
        required: true
        type: string
      version:
        description: Version being released; must equal pyproject.toml at the candidate
        required: true
        type: string
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  admission:
    name: Release admission (RELEASE READY)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: read
    steps:
      - name: Refuse dispatch from anything but the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "Release must be dispatched from ${{ github.event.repository.default_branch }}" >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Candidate version matches the requested release
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
        run: python scripts/check_release_request.py --candidate-sha "$CANDIDATE" --version "$VERSION"
      - name: Evaluate candidate against authenticated evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          python scripts/check_candidate_admission.py \
            --candidate-sha "$CANDIDATE" \
            --require "RELEASE READY" \
            --report admission-report.json
      - name: Preserve admission report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-admission-report
          path: admission-report.json
          if-no-files-found: error

  build:
    name: Build admitted candidate
    needs: admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [admission, build]
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  tag:
    name: Tag the admitted commit
    needs: [admission, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create v<version> at the admitted commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" -f sha="${CANDIDATE}"
